<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>s-generate</title>
    <!-- Пустой data-URI, чтобы браузер не просил favicon.ico: иконок у проекта нет. -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="src/ui/style.css">
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="Генеративная сцена"></canvas>
    <div class="toolbar">
      <select id="kind" aria-label="Что генерировать">
        <option value="mushroom">Гриб</option>
        <option value="tree">Дерево</option>
        <option value="hill">Холм</option>
        <option value="mountain">Гора</option>
        <option value="cloud">Облако</option>
      </select>
      <button id="mode" type="button">Сцена</button>
      <button id="next" type="button" title="Новый сид — пробел или R">Ещё</button>
      <button id="save" type="button">Скачать PNG</button>
    </div>
    <script type="module" src="src/app/main.js"></script>
  </body>
</html>
